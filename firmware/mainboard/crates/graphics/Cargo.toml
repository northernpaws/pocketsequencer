[package]
name = "graphics"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-graphics = { version = "0.8.1" }
embedded-graphics-core = "0.4.0"
embedded-graphics-framebuf = "0.5.0"
embedded-graphics-coordinate-transform = "0.1.1"
embedded-charts = { version = "0.3.0", default-features = false, features = [
    "basic-charts",
    "minimal-memory",
] }
embedded-layout = "0.4.2"

[features]
default = []
defmt = ["embedded-graphics/defmt"]
std = []
embeddded = ["embedded-charts/no_std"]
